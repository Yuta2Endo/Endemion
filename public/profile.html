<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b18">
  <meta name="robots" content="noindex">
  <title>Профиль — Endemion</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/account.css">
  <script type="module" src="/assets/profile.js"></script>
</head>
<body>
  <main class="account-shell">
    <nav class="account-nav">
      <a class="logo" href="/"><span class="logo-mark" aria-hidden="true">E</span>ENDEMION</a>
      <a class="back-link" href="/">← К каталогу</a>
    </nav>

    <section class="profile-layout" id="profile" hidden>
      <aside class="profile-card">
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <h1 id="profileName"></h1>
        <p class="profile-email" id="profileEmail"></p>
        <p class="profile-since" id="profileSince"></p>

        <div class="stats">
          <div class="stat"><strong id="statFavorites">0</strong><span>в избранном</span></div>
          <div class="stat"><strong id="statReading">0</strong><span>читаю</span></div>
          <div class="stat"><strong id="statCompleted">0</strong><span>прочитано</span></div>
          <div class="stat"><strong id="statChapters">0</strong><span>глав</span></div>
        </div>

        <div class="profile-actions">
          <button class="secondary-button" id="editButton" type="button" aria-expanded="false" aria-controls="editPanel">Настройки профиля</button>
          <a class="secondary-button admin-link" id="adminLink" href="/admin" hidden>Админка</a>
          <button class="danger-button" id="logoutButton" type="button">Выйти</button>
        </div>

        <div class="edit-form" id="editPanel" hidden>
          <form id="nameForm" novalidate>
            <h2>Имя</h2>
            <div class="field">
              <label for="newName">Имя пользователя</label>
              <input id="newName" type="text" autocomplete="nickname" minlength="2" maxlength="40" required>
            </div>
            <button class="secondary-button" type="submit">Сохранить имя</button>
          </form>

          <form id="passwordForm" novalidate>
            <h2>Пароль</h2>
            <!-- Скрытая почта помогает менеджеру паролей понять, для какого аккаунта новый пароль -->
            <input id="usernameHint" type="email" autocomplete="username" hidden>
            <div class="field">
              <label for="currentPassword">Текущий пароль</label>
              <input id="currentPassword" type="password" autocomplete="current-password" maxlength="128" required>
            </div>
            <div class="field">
              <label for="newPassword">Новый пароль</label>
              <input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
            </div>
            <button class="secondary-button" type="submit">Сменить пароль</button>
          </form>

          <form id="deleteForm" novalidate>
            <h2>Удаление аккаунта</h2>
            <div class="field">
              <label for="deletePassword">Пароль для подтверждения</label>
              <input id="deletePassword" type="password" autocomplete="current-password" maxlength="128" required>
            </div>
            <button class="danger-button" type="submit">Удалить аккаунт навсегда</button>
          </form>

          <p class="form-message" id="settingsMessage" role="status" aria-live="polite"></p>
        </div>
      </aside>

      <section class="favorites-panel" aria-labelledby="libraryTitle">
        <h2 id="libraryTitle">Моя полка</h2>
        <p class="panel-description">Избранное и тайтлы с отметками. Всё хранится в аккаунте и доступно с любого устройства.</p>

        <div class="library-tabs" id="libraryTabs" role="group" aria-label="Подборка">
          <button type="button" data-filter="favorites" aria-pressed="true">Избранное</button>
          <button type="button" data-filter="reading" aria-pressed="false">Читаю</button>
          <button type="button" data-filter="planned" aria-pressed="false">Буду читать</button>
          <button type="button" data-filter="completed" aria-pressed="false">Прочитано</button>
          <button type="button" data-filter="dropped" aria-pressed="false">Брошено</button>
        </div>

        <div class="favorite-list" id="libraryList"></div>
      </section>
    </section>
  </main>
</body>
</html>
