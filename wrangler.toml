# Cloudflare Worker со статическими файлами. Деплой: `npm run deploy`
name = "endemion"
main = "src/worker.js"
compatibility_date = "2026-10-01"
# Превью-ссылки на каждую версию были выключены до переноса на этот конфиг: оставляем так же
preview_urls = false

[assets]
directory = "public"
binding = "ASSETS"
# /auth отдаёт auth.html, /auth.html перенаправляет на /auth
html_handling = "auto-trailing-slash"
# Неизвестный адрес получает public/404.html с кодом 404
not_found_handling = "404-page"
# Все адреса сначала обрабатывает Worker (src/worker.js): он перенаправляет старый адрес workers.dev на новый домен,
# а то, что не относится к его маршрутам, отдаёт из статических файлов
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "endemion"
database_id = "d823a847-a9d6-40a1-95fa-c71d1de67566"
migrations_dir = "migrations"

# Картинки страниц глав (<тайтл>/<глава>/<версия>/<страница>) и обложки (covers/<тайтл>/<версия>).
# Тип файла — в Content-Type объекта
[[r2_buckets]]
binding = "PAGES"
bucket_name = "endemion-pages"

[vars]
# Сайт переехал на свой сервер. Запросы на *.workers.dev перенаправляются сюда; локальный wrangler dev не затрагивается
REDIRECT_TO = "https://endemion.online"
# Ключи Turnstile (защита формы от ботов) необязательны: без них форма работает без капчи.
# Публичный ключ можно указать здесь, секретный — только через `npx wrangler secret put TURNSTILE_SECRET_KEY`
TURNSTILE_SITE_KEY = ""
# Отправитель писем восстановления пароля, например "Endemion <noreply@ваш-домен>". Домен должен быть подтверждён в Resend,
# ключ API задаётся секретом: `npx wrangler secret put RESEND_API_KEY`. Пока они не заданы, восстановление пароля выключено
MAIL_FROM = ""
# Токен Cloudflare Web Analytics (Web Analytics → Add a site → токен из JS-сниппета). Публичный, не секрет.
# Пустой — статистика не собирается
WEB_ANALYTICS_TOKEN = "17c0bf0efcb1443e9cb740a20b5fd615"

[observability]
enabled = true
